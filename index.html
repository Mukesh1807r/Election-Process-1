<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Election Guide AI Antigravity — an intelligent, accessible assistant helping every citizen understand and participate in the democratic process." />
    <meta name="theme-color" content="#0F172A" />
    <title>Election Guide AI Antigravity</title>
    <!-- Preload critical font for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Skip nav link — WCAG 2.1 AA requirement */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 1rem;
        background: #4F46E5;
        color: white;
        padding: 0.75rem 1.25rem;
        border-radius: 0 0 8px 8px;
        font-weight: 600;
        text-decoration: none;
        z-index: 9999;
        transition: top 0.2s;
      }
      .skip-link:focus { top: 0; }
    </style>
  </head>
  <body>
    <!-- Skip Navigation — keyboard accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
